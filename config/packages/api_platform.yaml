api_platform:
    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    # Mission 35 : bouton "Authorize" de Swagger UI (le token JWT est envoyé dans le header Authorization)
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
